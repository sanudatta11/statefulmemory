[workspace]
resolver = "2"
members = [
    "crates/memlayer-core",
    "crates/memlayer-proto",
    "crates/memlayer-storage",
    "crates/memlayer-daemon",
    "crates/memlayer-client",
    "crates/memlayer-cli",
    "crates/memlayer-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["memlayer contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/memlayer/memlayer"
rust-version = "1.75"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"

# gRPC stack
tonic = { version = "0.12", features = ["transport", "tls"] }
prost = "0.13"
prost-types = "0.13"
tonic-build = { version = "0.12", default-features = false, features = ["prost"] }
tonic-reflection = "0.12"
tower = { version = "0.5", features = ["util"] }
hyper-util = { version = "0.1", features = ["tokio"] }

# Storage
rusqlite = { version = "0.32", features = ["bundled-full", "chrono"] }
refinery = { version = "0.8", features = ["rusqlite"] }

# Serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Error handling
thiserror = "1"
anyhow = "1"

# Crypto / IDs
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
subtle = "2"
base64 = "0.22"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Filesystem / OS
nix = { version = "0.29", features = ["fs", "resource", "signal", "user"] }
fs2 = "0.4"
dirs = "5"

# TLS
rustls = "0.23"
rustls-pemfile = "2"
rcgen = "0.13"

# Misc
once_cell = "1"
parking_lot = "0.12"
crossbeam-channel = "0.5"
hex = "0.4"
clap = { version = "4", features = ["derive", "env"] }
is-terminal = "0.4"
serde_yaml = "0.9"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
opt-level = 3

[profile.dev]
debug = "line-tables-only"
