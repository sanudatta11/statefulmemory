name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            smoke: true
          # Cross-compile the Intel slice from the arm64 runner (Intel macOS
          # runners are gone); cannot execute it here — smoke: false.
          - os: darwin
            arch: amd64
            runner: macos-latest
            target: x86_64-apple-darwin
            smoke: false
          # ubuntu-22.04 (glibc 2.35) for wider binary compatibility.
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            smoke: true
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            smoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf cmake

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            protobuf-compiler \
            cmake
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p statefulmemory-cli --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.smoke
        run: |
          BIN="target/${{ matrix.target }}/release"
          "$BIN/statefulmemory" --version
          "$BIN/statefulmemory" version
          "$BIN/smem" --version

      - name: Package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BASE="statefulmemory-${TAG}-${{ matrix.os }}-${{ matrix.arch }}"
          STAGE="target/pkg/${BASE}"
          BIN="target/${{ matrix.target }}/release"
          mkdir -p "$STAGE"
          install -m 755 "$BIN/statefulmemory" "$STAGE/statefulmemory"
          install -m 755 "$BIN/smem" "$STAGE/smem"
          # `sm` shorthand is a copy of the same binary (Makefile parity).
          install -m 755 "$BIN/statefulmemory" "$STAGE/sm"
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGE/"
          if [ "${{ matrix.os }}" = "darwin" ]; then
            # Ad-hoc resign post-strip (PRD §14.3) — prevents AMFI SIGKILL.
            codesign --force --sign - "$STAGE/statefulmemory" "$STAGE/smem" "$STAGE/sm"
          fi
          tar -czf "${BASE}.tar.gz" -C target/pkg "$BASE"
          ls -lh "${BASE}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}-${{ matrix.arch }}
          path: "*.tar.gz"
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -lh *.tar.gz
          test "$(ls -1 *.tar.gz | wc -l)" -eq 4
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
