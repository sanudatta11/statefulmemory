name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build:
    name: Build ${{ matrix.os }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: darwin
            arch: arm64
            runner: macos-latest
            target: aarch64-apple-darwin
            smoke: true
          # Cross-compile the Intel slice from the arm64 runner (Intel macOS
          # runners are gone); cannot execute it here — smoke: false.
          - os: darwin
            arch: amd64
            runner: macos-latest
            target: x86_64-apple-darwin
            smoke: false
          # ubuntu-22.04 (glibc 2.35) for wider binary compatibility.
          - os: linux
            arch: amd64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            smoke: true
          - os: linux
            arch: arm64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            smoke: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf cmake

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            protobuf-compiler \
            cmake
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p statefulmemory-cli --target ${{ matrix.target }}

      - name: Smoke test
        if: matrix.smoke
        run: |
          BIN="target/${{ matrix.target }}/release"
          "$BIN/statefulmemory" --version
          "$BIN/statefulmemory" version
          "$BIN/smem" --version

      - name: Package
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          BASE="statefulmemory-${TAG}-${{ matrix.os }}-${{ matrix.arch }}"
          STAGE="target/pkg/${BASE}"
          BIN="target/${{ matrix.target }}/release"
          mkdir -p "$STAGE"
          install -m 755 "$BIN/statefulmemory" "$STAGE/statefulmemory"
          install -m 755 "$BIN/smem" "$STAGE/smem"
          # `sm` shorthand is a copy of the same binary (Makefile parity).
          install -m 755 "$BIN/statefulmemory" "$STAGE/sm"
          cp LICENSE-MIT LICENSE-APACHE README.md "$STAGE/"
          if [ "${{ matrix.os }}" = "darwin" ]; then
            # Ad-hoc resign post-strip (PRD §14.3) — prevents AMFI SIGKILL.
            codesign --force --sign - "$STAGE/statefulmemory" "$STAGE/smem" "$STAGE/sm"
          fi
          tar -czf "${BASE}.tar.gz" -C target/pkg "$BASE"
          ls -lh "${BASE}.tar.gz"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.os }}-${{ matrix.arch }}
          path: "*.tar.gz"
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          ls -lh *.tar.gz
          test "$(ls -1 *.tar.gz | wc -l)" -eq 4
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Build signed update manifest
        working-directory: dist
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.STATEFULMEMORY_UPDATE_SIGNING_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$UPDATE_SIGNING_KEY" || { echo "::error::STATEFULMEMORY_UPDATE_SIGNING_KEY secret is required"; exit 1; }
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import re
          from datetime import datetime, timezone

          tag = os.environ["RELEASE_TAG"]
          releases = {}
          for path in sorted(pathlib.Path(".").glob("statefulmemory-*.tar.gz")):
              match = re.fullmatch(r"statefulmemory-(.+)-(darwin|linux)-(arm64|amd64)\.tar\.gz", path.name)
              if not match:
                  continue
              platform = f"{match.group(2)}-{match.group(3)}"
              releases[platform] = {
                  "url": f"https://github.com/sanudatta11/statefulmemory/releases/download/{tag}/{path.name}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              }
          if not releases:
              raise SystemExit("no release archives found")
          manifest = {
              "version": tag.removeprefix("v"),
              "published_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "releases": releases,
          }
          pathlib.Path("statefulmemory-update.json").write_text(
              json.dumps(manifest, sort_keys=True, separators=(",", ":")) + "\n"
          )
          PY
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/statefulmemory-update-key.pem"
          openssl pkeyutl -sign -rawin \
            -inkey "$RUNNER_TEMP/statefulmemory-update-key.pem" \
            -in statefulmemory-update.json \
            -out statefulmemory-update.json.sig
          rm -f "$RUNNER_TEMP/statefulmemory-update-key.pem"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/statefulmemory-update.json
            dist/statefulmemory-update.json.sig
          generate_release_notes: true
          fail_on_unmatched_files: true
