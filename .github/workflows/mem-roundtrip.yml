name: Memory Portability Round-Trip

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:
    inputs:
      source_sha:
        description: Commit to check when invoked by the manual release workflow
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: mem-roundtrip-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  mem-roundtrip:
    name: .mem export → wipe → import integrity
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev protobuf-compiler
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build --locked -p statefulmemory-cli --release

      - name: Export → wipe → import round-trip
        run: |
          set -euo pipefail
          T=${{ runner.temp }}/statefulmemory-rt
          rm -rf "$T" && mkdir -p "$T"
          export STATEFULMEMORY_DATA_DIR="$T"
          BIN=$PWD/target/release/statefulmemory
          mkdir -p repo && cd repo
          git init -q . && git config user.email rt@ci && git config user.name rt
          printf 'fn main(){}\n' > main.rs && git add . && git commit -qm init

          P1=$(git -C . rev-parse HEAD)
          # graph.enabled before saves -> save-path IndexGraph writes edges
          # (rebuild alone only backfills anchor entities/mentions).
          "$BIN" config set graph.enabled true
          "$BIN" obs save --type decision --title "portable decision one" \
            --content 'decision one content `token`' --anchor main.rs::one
          "$BIN" obs save --type decision --title "portable decision two" \
            --content 'decision two content superseding the older one' --anchor main.rs::two
          "$BIN" graph rebuild

          "$BIN" --output json graph stats > /tmp/stats-before.json
          python3 - <<'PY'
          import json, sys
          s = json.load(open("/tmp/stats-before.json"))
          for k in ("total_entities", "total_mentions", "total_edges"):
              assert s[k] >= 1, f"expected {k} >= 1 before export, got {s[k]}"
          assert s.get("edges_by_relation"), "edges_by_relation empty before export"
          print("pre-export graph OK:", s)
          PY

          "$BIN" mem export --out "$T/backup.mem"
          test -s "$T/backup.mem" || { echo "export produced empty archive"; exit 1; }

          # Wipe project state, import merges it back. Stop the daemon FIRST so
          # it drops the cached project connection — otherwise import writes to
          # the just-deleted inode and every read afterward misses the DB.
          "$BIN" daemon stop
          rm -rf "$T/projects" "$T/global.sqlite" 2>/dev/null || true
          "$BIN" mem import "$T/backup.mem" --mode merge

          # Supersession + observation rows survive.
          "$BIN" obs search "portable decision" --mode hybrid | grep -q "portable" \
            || { echo "imported observations missing"; exit 1; }

          # .mem v2 carries the entity graph; entities + mentions + edges and
          # the relation map must all survive the wipe byte-for-byte.
          "$BIN" --output json graph stats > /tmp/stats-after.json
          python3 - <<'PY'
          import json, sys
          b = json.load(open("/tmp/stats-before.json"))
          a = json.load(open("/tmp/stats-after.json"))
          for k in ("total_entities", "total_mentions", "total_edges"):
              if a[k] != b[k]:
                  print(f"FAIL {k}: before={b[k]} after={a[k]}", file=sys.stderr)
                  sys.exit(1)
          if sorted(map(tuple, a.get("edges_by_relation", []))) != sorted(
              map(tuple, b.get("edges_by_relation", []))
          ):
              print("FAIL edges_by_relation mismatch:", b.get("edges_by_relation"),
                    a.get("edges_by_relation"), file=sys.stderr)
              sys.exit(1)
          print("post-import graph fidelity OK:", a)
          PY
