name: Graph Smoke & Briefing Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: graph-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  graph-smoke:
    name: Entity graph smoke + briefing expansion
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev protobuf-compiler
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build CLI
        run: cargo build -p statefulmemory-cli --release

      - name: Seed + verify graph (module unit contract)
        env:
          STATEFULMEMORY_DATA_DIR: ${{ runner.temp }}/statefulmemory-smoke
        run: |
          set -euo pipefail
          T=${{ runner.temp }}/statefulmemory-data
          rm -rf "$T" && mkdir -p "$T"
          export STATEFULMEMORY_DATA_DIR="$T"
          BIN=$PWD/target/release/statefulmemory
          # Daemon needs a git repo for anchors; make a throwaway one.
          mkdir -p repo && cd repo
          git init -q . && git config user.email smoke@ci && git config user.name smoke
          printf 'fn main(){}\n' > main.rs && git add . && git commit -qm init
          # Enable graph (default-off) for the expansion smoke, disable-clean check below.
          "$BIN" config set graph.enabled true

          # Three observations sharing entities: two anchored to code symbols.
          "$BIN" obs save --type decision --title "use validate before refresh" \
            --content 'auth pipeline: run `validate` then `refresh` token' \
            --anchor main.rs::validate_mw
          "$BIN" obs save --type decision --title "refresh conn backoff" \
            --content 'on 5xx `validate` retries with backoff `refresh`' \
            --anchor main.rs::backoff
          "$BIN" obs save --type decision --title "rate limit caps" \
            --content 'cap `validate` calls at 100/min, `refresh` at 20/min' \
            --anchor main.rs::limit

          # Graph CLI verbs (daemon-independent paths).
          "$BIN" graph rebuild
          "$BIN" --output json graph stats > /tmp/graph-stats.json
          cat /tmp/graph-stats.json
          python3 - <<'PY'
          import json, sys
          s = json.load(open("/tmp/graph-stats.json"))
          if s["total_entities"] < 3:
              print("expected >=3 entities,", s["total_entities"], file=sys.stderr); sys.exit(1)
          if s["total_edges"] < 1:
              print("expected >=1 edge,", s["total_edges"], file=sys.stderr); sys.exit(1)
          if s["total_mentions"] < 3:
              print("expected >=3 mentions,", s["total_mentions"], file=sys.stderr); sys.exit(1)
          if not s.get("edges_by_relation"):
              print("edges_by_relation empty", file=sys.stderr); sys.exit(1)
          print("stats OK:", s)
          PY

          # Graph query RPC must walk live edges (seed + neighbors + edges).
          "$BIN" graph query validate --hops 2 --json > /tmp/graph-q.json
          python3 - <<'PY'
          import json, sys
          q = json.load(open("/tmp/graph-q.json"))
          if not q.get("edges"):
              print("graph query returned no edges:", q, file=sys.stderr); sys.exit(1)
          if len(q.get("entities", [])) < 2:
              print("expected seed + neighbor entities:", q, file=sys.stderr); sys.exit(1)
          print("query OK:", len(q["entities"]), "entities,", len(q["edges"]), "edges")
          PY

          # Briefing expansion: with [graph] on, seeded query returns the
          # co-mentioning decision rows through the context RPC (provenance
          # logged server-side; presence of >0 results is the smoke contract).
          "$BIN" obs context --query 'what limits `validate` calls' --max-tokens 2000 > /tmp/ctx-out.txt
          test -s /tmp/ctx-out.txt || { echo "context returned nothing"; exit 1; }

      - name: Graph-disabled parity (byte-level behavior preserved)
        run: |
          set -euo pipefail
          # Default config has graph.enabled=false; unit tests assert output is
          # unchanged when disabled (service) and zero expansion on empty cues
          # (daemon lib). Re-run the daemon lib graph tests as the parity gate.
          # `timeout` bounds each binary so a hang cannot eat the job budget.
          timeout 300 cargo test -p statefulmemory-daemon --lib -- graph_expansion
          timeout 300 cargo test -p statefulmemory-storage --lib -- graph::
          timeout 300 cargo test -p statefulmemory-cli --lib -- cmd_graph::