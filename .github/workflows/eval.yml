name: Evaluation Scorecard & Retrieval Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# PR comment step needs write; contents is enough for checkout + build.
permissions:
  contents: read
  pull-requests: write

jobs:
  eval-smoke:
    name: Retrieval Benchmark Scorecard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            protobuf-compiler
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run memlayer eval smoke benchmark
        run: |
          mkdir -p ./eval
          cargo run -p memlayer-cli -- eval --smoke --benchmark locomo --save-scorecard ./eval/scorecard.json --output json > ./eval/scorecard_output.json

      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-scorecard
          path: ./eval/scorecard.json

      - name: Comment PR Scorecard
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const card = JSON.parse(fs.readFileSync('./eval/scorecard.json', 'utf8'));
            const marker = '<!-- memlayer-retrieval-scorecard -->';
            const body = `${marker}
            ### memlayer Retrieval Benchmark Scorecard
            - **Benchmark**: ${card.benchmark}
            - **Commit**: \`${card.commit_hash}\`
            - **Accuracy**: **${card.accuracy_pct.toFixed(2)}%**
            - **F1 Score**: **${card.f1_score.toFixed(4)}**
            - **Retrieval Latency (p50)**: ${card.retrieval_p50_ms.toFixed(2)} ms
            - **Retrieval Latency (p95)**: ${card.retrieval_p95_ms.toFixed(2)} ms
            - **End-to-End Latency (p50)**: ${card.end_to_end_p50_ms.toFixed(2)} ms
            `;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
