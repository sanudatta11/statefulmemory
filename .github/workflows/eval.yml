name: Evaluation Scorecard & Retrieval Benchmark

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# PR comment step needs write; contents is enough for checkout + build.
permissions:
  contents: write
  pull-requests: write

jobs:
  eval-smoke:
    name: Retrieval Benchmark Scorecard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            protobuf-compiler
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Run statefulmemory eval smoke benchmark
        run: |
          mkdir -p ./eval
          cargo run -p statefulmemory-cli -- eval --smoke --benchmark locomo --save-scorecard ./eval/scorecard.json --output json > ./eval/scorecard_output.json

      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@v5
        with:
          name: benchmark-scorecard
          path: ./eval/scorecard.json

      - name: Scorecard regression gate
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node .github/scripts/eval-gate.mjs ./eval/scorecard.json ./eval/baseline.json

      - name: Comment PR Scorecard
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const card = JSON.parse(fs.readFileSync('./eval/scorecard.json', 'utf8'));
            const marker = '<!-- statefulmemory-retrieval-scorecard -->';
            const body = `${marker}
            ### statefulmemory Retrieval Benchmark Scorecard
            - **Benchmark**: ${card.benchmark}
            - **Commit**: \`${card.commit_hash}\`
            - **Accuracy**: **${card.accuracy_pct.toFixed(2)}%**
            - **Recall@k**: **${(card.recall_at_k ?? 0).toFixed(4)}**
            - **MRR**: **${(card.mrr ?? 0).toFixed(4)}**
            - **Retrieval Latency (p50)**: ${card.retrieval_p50_ms.toFixed(2)} ms
            - **Retrieval Latency (p95)**: ${card.retrieval_p95_ms.toFixed(2)} ms
            - **End-to-End Latency (p50)**: ${card.end_to_end_p50_ms.toFixed(2)} ms
            `;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

  update-scorecard:
    name: Update README Scorecard
    needs: eval-smoke
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download Scorecard Artifact
        uses: actions/download-artifact@v5
        with:
          name: benchmark-scorecard
          path: ./eval

      - name: Update README scorecard section
        run: node .github/scripts/update-readme-scorecard.mjs ./eval/scorecard.json README.md

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "No scorecard changes to commit"
          else
            git commit -m "ci: update README scorecard from eval smoke [skip ci]"
            git push
          fi
