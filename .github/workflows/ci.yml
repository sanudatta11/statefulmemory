name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      source_sha:
        description: Commit to check when invoked by the manual release workflow
        required: false
        type: string
        default: ''
      strict_format:
        description: Make formatting failures block the workflow
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libssl-dev \
            protobuf-compiler
          protoc --version

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: statefulmemory-ci

      - name: Check inputs
        run: make check-inputs

      - name: Build workspace (incl. tests)
        run: cargo build --workspace --tests --locked

      - name: Unit tests
        # `timeout` is a hard outer bound: a single hung test/binary cannot
        # burn the full job budget (inner waits are already bounded per process).
        run: timeout 900 cargo test --locked --workspace --lib --bins -- --test-threads=2

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Format check
        run: cargo fmt --all -- --check
        continue-on-error: ${{ !inputs.strict_format }}

      - name: Integration tests
        run: timeout 1200 cargo test --locked -p statefulmemory-tests -- --test-threads=1

  website-build:
    name: Website build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: website

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build
