[package]
name = "memlayer-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "memlayer gRPC client: tonic Channel wrapper, bearer interceptor, retry helper."

[dependencies]
memlayer-proto = { path = "../memlayer-proto" }

tokio.workspace = true
tonic.workspace = true
tower.workspace = true
hyper-util.workspace = true
# rustls is pulled in transitively by tonic's TLS feature; we depend on it
# directly so we can install a default CryptoProvider before any
# ClientTlsConfig is built (rustls 0.23 panics if neither aws-lc-rs nor
# ring is unambiguously selected — the workspace pulls both transitively).
rustls.workspace = true

tracing.workspace = true
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
