<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>statefulmemory UI</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#15181f; --line:#262b36; --acc:#ff6b35; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:#d7dce4; font:14px/1.5 ui-monospace,Menlo,monospace; }
  header { display:flex; gap:16px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; color:#fff; }
  .acc { color:var(--acc); }
  main { max-width:1080px; margin:24px auto; padding:0 20px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; margin-bottom:18px; }
  .card h2 { margin:0 0 10px; font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:#9aa4b2; }
  input[type=text] { width:100%; padding:10px 12px; background:#0b0d11; color:#e6ebf1; border:1px solid var(--line); border-radius:8px; }
  input[type=text]::placeholder { color:#5c6672; }
  button { background:var(--acc); color:#0b0d11; font-weight:600; border:0; border-radius:8px; padding:10px 18px; cursor:pointer; }
  .row { display:flex; gap:10px; }
  .hit { border-top:1px solid var(--line); padding:10px 0; }
  .hit b { color:#fff; }
  .muted, .muted * { color:#7c8590; font-size:13px; }
  .graph-svg { width:100%; height:340px; background:#0b0d11; border:1px solid var(--line); border-radius:8px; }
  .badge { display:inline-block; padding:1px 8px; border-radius:10px; font-size:11px; margin-left:8px; }
  .badge.good { background:#173c25; color:#5fe08a; }
  .badge.warn { background:#3c2a17; color:#f0b45f; }
</style>
</head>
<body>
<header><h1><span class="acc">statefulmemory</span> UI</h1><span class="muted">loopback dashboard</span></header>
<main>
  <div class="card"><h2>Stats</h2><div id="stats" class="muted">loading…</div></div>
  <div class="card"><h2>Search</h2>
    <div class="row">
      <input type="text" id="q" placeholder="e.g. why did we pick pgx?" aria-label="Search memories" />
      <button id="btn" type="button">Search</button>
    </div>
    <div id="results" aria-live="polite"></div>
  </div>
  <div class="card"><h2>Graph</h2>
    <div class="row">
      <input type="text" id="ge" placeholder="entity, e.g. validate" />
      <button id="gbtn">Query graph</button>
    </div>
    <svg class="graph-svg" id="svg"></svg>
  </div>
  <div class="card"><h2>Decide</h2>
    <div class="row">
      <input type="text" id="dq" placeholder="Should we …?" />
      <button id="dbtn">Ask</button>
    </div>
    <div id="answer"></div>
  </div>
</main>
<script>
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s||'').replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
  async function post(path, body) {
    const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.message || data.error || 'request failed');
    return data;
  }
  document.addEventListener('DOMContentLoaded', async () => {
    const st = await post('/api/stats', {});
    $('#stats').textContent = `observations scanned: ${st.observations_scanned ?? '-'}, consolidation candidates: ${st.consolidation_proposals ?? '-'}` + (st.error ? ` (${esc(st.error)})` : '');
  });
  $('#btn').addEventListener('click', async () => {
    const q = $('#q').value.trim(); if (!q) return;
    $('#results').innerHTML = '<p class="muted">searching…</p>';
    try {
      const d = await post('/api/search', { query: q });
      const hits = d.hits || [];
      $('#results').innerHTML = hits.length
        ? hits.slice(0, 20).map((hit) => '<article class="hit"><b>' + esc(hit.title) + '</b><div class="muted">' + esc(hit.content) + '</div><small class="muted">' + esc(hit.type) + ' · #' + esc(hit.id) + '</small></article>').join('')
        : '<p class="muted">no results</p>';
    } catch (error) {
      $('#results').innerHTML = '<p class="muted">' + esc(error.message || 'request failed') + '</p>';
    }
  });
  $('#gbtn').addEventListener('click', async () => {
    const e = $('#ge').value.trim(); if (!e) return;
    const d = await post('/api/graph', { entity: e, hops: 1 });
    if (d.error) { alert(d.error); return; }
    drawGraph(d);
  });
  function drawGraph(d) {
    const svg = $('#svg'); svg.innerHTML = '';
    const W = svg.clientWidth || 900, H = 340;
    const nodes = {}; (d.entities||[]).forEach(en => { nodes[en.id] = en; });
    const idArr = Object.keys(nodes);
    if (!idArr.length) return;
    const center = idArr.find(id => nodes[id].name === d.seed) || null;
    const ring = idArr.filter(id => id !== center);
    const N = ring.length || 1;
    const R = Math.min(W, H) / 2 - 40, cx = W/2, cy = H/2;
    const pos = {};
    if (center != null) pos[center] = { x: cx, y: cy };
    ring.forEach((id, i) => { const a = 2*Math.PI*i/N - Math.PI/2; pos[id] = { x: cx + R*Math.cos(a), y: cy + R*Math.sin(a) }; });
    (d.edges||[]).forEach(ed => {
      const s = pos[ed.source], t = pos[ed.target]; if (!s || !t) return;
      const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line.setAttribute('x1', s.x); line.setAttribute('y1', s.y);
      line.setAttribute('x2', t.x); line.setAttribute('y2', t.y);
      line.setAttribute('stroke', '#3a4356'); line.setAttribute('stroke-width', Math.min(1 + (ed.weight||0), 4));
      svg.appendChild(line);
    });
    Object.keys(pos).forEach(id => {
      const p = pos[id], n = nodes[id];
      const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
      const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      c.setAttribute('cx', p.x); c.setAttribute('cy', p.y);
      c.setAttribute('r', id === center ? 14 : 9);
      c.setAttribute('fill', id === center ? '#ff6b35' : '#2a3344');
      const t = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      t.setAttribute('x', p.x + (id===center?16:10)); t.setAttribute('y', p.y+4);
      t.setAttribute('fill', '#c9d2de'); t.setAttribute('font-size', '12');
      t.textContent = (n.name||'').slice(0,22);
      g.appendChild(c); g.appendChild(t); svg.appendChild(g);
    });
  }
  $('#dbtn').addEventListener('click', async () => {
    const q = $('#dq').value.trim(); if (!q) return;
    $('#answer').innerHTML = '<p class="muted">thinking…</p>';
    const d = await post('/api/decide', { question: q });
    $('#answer').innerHTML = d.error ? '<p class="muted">' + esc(d.error) + '</p>' : '<p>' + esc(d.answer || '') + '</p>';
  });
</script>
</body>
</html>
