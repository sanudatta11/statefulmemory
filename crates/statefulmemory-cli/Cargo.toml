[package]
name = "statefulmemory-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
default-run = "statefulmemory"
description = "statefulmemory CLI: clap dispatch, output formatting, project detection, daemon auto-spawn."

[[bin]]
name = "statefulmemory"
path = "src/main.rs"

[[bin]]
name = "smem"
path = "src/main.rs"

[lib]
name = "statefulmemory_cli"
