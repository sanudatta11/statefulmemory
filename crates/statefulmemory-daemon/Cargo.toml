[package]
name = "statefulmemory-daemon"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "statefulmemory daemon binary: tonic gRPC server, lifecycle, signals, TLS."

[lib]
name = "statefulmemory_daemon"
path = "src/lib.rs"

# The `statefulmemory` binary moved to crates/statefulmemory-cli starting with Spec 2:
# Cargo errors out if two workspace packages share a binary name.
# `daemon start --foreground` is dispatched from statefulmemory-cli's main.rs
# into statefulmemory_daemon::server::run. The orphaned src/main.rs is kept for
# git history only; cargo no longer compiles it.

[dependencies]
statefulmemory-core = { path = "../statefulmemory-core" }
statefulmemory-proto = { path = "../statefulmemory-proto" }
statefulmemory-storage = { path = "../statefulmemory-storage" }
statefulmemory-sync = { path = "../statefulmemory-sync" }
statefulmemory-embed = { path = "../statefulmemory-embed" }
statefulmemory-extract = { path = "../statefulmemory-extract" }
statefulmemory-retrieval = { path = "../statefulmemory-retrieval" }

tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
prost.workspace = true
prost-types.workspace = true

rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
sha2.workspace = true
subtle.workspace = true
hex.workspace = true
base64.workspace = true
parking_lot.workspace = true
once_cell.workspace = true
crossbeam-channel.workspace = true
nix.workspace = true
fs2.workspace = true
rcgen.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
getrandom.workspace = true
ureq.workspace = true

[dev-dependencies]
tempfile = "3"
