# Generated with AI Coding Rules Hub
[package]
name = "statefulmemory-embed"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
candle-core         = { workspace = true }
candle-nn           = { workspace = true }
candle-transformers = { workspace = true }
tokenizers          = { workspace = true }
hf-hub              = { workspace = true }
rusqlite            = { workspace = true }
parking_lot         = { workspace = true }
sha2                = { workspace = true }
zerocopy            = { workspace = true }
anyhow              = { workspace = true }
tracing             = { workspace = true }
serde_json          = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Gate online integration tests that hit HuggingFace Hub.
# Default `cargo test` MUST NOT trigger any network or model downloads.
online-tests = []

# Hardware acceleration backends for the BGE forward (opt-in; default is the
# portable CPU gemm). Enable at build time, e.g.
#   cargo build -p statefulmemory-cli --features statefulmemory-embed/accelerate
# - accelerate: Apple Accelerate BLAS (macOS) — CPU, faster matmul.
# - mkl:        Intel MKL (x86-64 Linux) — CPU, faster matmul.
# - metal:      Apple Metal GPU (Apple Silicon) — runs the model on the GPU.
accelerate = [
    "candle-core/accelerate",
    "candle-nn/accelerate",
    "candle-transformers/accelerate",
]
mkl = ["candle-core/mkl", "candle-nn/mkl", "candle-transformers/mkl"]
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
