[package]
name = "memlayer-eval"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[dependencies]
memlayer-core      = { path = "../memlayer-core" }
memlayer-storage   = { path = "../memlayer-storage" }
memlayer-embed     = { path = "../memlayer-embed" }
memlayer-extract   = { path = "../memlayer-extract" }
memlayer-retrieval = { path = "../memlayer-retrieval" }

rusqlite    = { workspace = true }
refinery    = { workspace = true }
sqlite-vec  = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
clap        = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
anyhow      = { workspace = true }
thiserror   = { workspace = true }
sha2        = { workspace = true }

# Token counting (tiktoken-compatible BPE, used for prompt-size metrics)
tiktoken-rs = "0.6"

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Gate online integration tests that require the BGE-small embedding model.
# Default `cargo test` MUST NOT trigger any network or model downloads.
online-tests = []
