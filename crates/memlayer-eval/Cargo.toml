[package]
name = "memlayer-eval"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[dependencies]
memlayer-core    = { path = "../memlayer-core" }
memlayer-storage = { path = "../memlayer-storage" }
memlayer-embed   = { path = "../memlayer-embed" }

rusqlite    = { workspace = true }
sqlite-vec  = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { workspace = true }
clap        = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
anyhow      = { workspace = true }

# HTTP client for Claude API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# Token counting (tiktoken-compatible BPE, used for prompt-size metrics)
tiktoken-rs = "0.6"

[dev-dependencies]
tempfile = { workspace = true }

[features]
# Gate online integration tests that require the BGE-small embedding model.
# Default `cargo test` MUST NOT trigger any network or model downloads.
online-tests = []
